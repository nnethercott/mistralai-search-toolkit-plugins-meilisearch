[project]
name = "mistralai-search-toolkit-plugins-meilisearch"
version = "0.1.0"
description = "Meilisearch plugin for Mistral Search Toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "mistralai-search-toolkit>=0.0.13,<0.1",
    "meilisearch-python-sdk",
    "pydantic>=2.13.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mistralai"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
